# Agents share a network with Toolbox only; MySQL shares one with Toolbox only.
# Both are internal, so neither has a route to anywhere else.
name: toolbox-mysql-boundary

networks:
  agent-net:
    internal: true
  db-net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24

secrets:
  mysql_root_password:
    file: ./.run/mysql_root_password
  db_password:
    file: ./.run/db_password

services:
  mysql:
    image: mysql:8.4
    networks:
      db-net:
        ipv4_address: 172.30.1.20
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
      - db_password
    volumes:
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$(cat /run/secrets/mysql_root_password) --silent"]
      interval: 2s
      retries: 60

  toolbox:
    image: toolbox-mysql-boundary:local
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      agent-net:
        aliases: [toolbox]
      db-net:
        ipv4_address: 172.30.1.10
    secrets:
      - db_password
    volumes:
      - ./tools.yaml:/config/tools.yaml:ro
    # The password stays out of the image, compose.yaml and `docker inspect`.
    entrypoint:
      - sh
      - -c
      - DB_PASSWORD=$(cat /run/secrets/db_password) exec /usr/local/bin/toolbox --config /config/tools.yaml --strict-governance --address 0.0.0.0 --port 5000 --enable-api --logging-format json

  # Stands in for an agent that can run arbitrary code. It has a shell, curl and
  # network tools on purpose: the boundary must hold without trusting it.
  agent:
    image: golang:1.27.3
    networks:
      - agent-net
    command: ["sleep", "infinity"]
