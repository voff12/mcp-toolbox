kind: source
name: shop
type: mysql
host: 172.30.1.20
port: "3306"
database: shop
user: ${DB_USER:toolbox_ro}
password: ${DB_PASSWORD}
identityCheck: read-only
queryGuard:
  maxConcurrent: 4
  maxQueue: 20
  queueTimeout: 500ms
  queryTimeout: 6s
  statementTimeout: 4s
  lockTimeout: 1s
  maxRows: 500
  maxResultBytes: 2MiB
---
kind: tool
name: query_customers
type: mysql-sql
source: shop
description: Look up customers by level. Results are masked.
statement: SELECT id, customer_name, phone FROM customers WHERE level = ? ORDER BY id LIMIT 200
parameters:
  - name: level
    type: string
    description: Customer level
resultMasking:
  allow: [id]
  rules:
    - {column: customer_name, action: keep, first: 1}
    - {column: phone, action: keep, first: 3, last: 4, replacement: "****"}
---
kind: tool
name: explain_query_customers
type: mysql-explain
tool: query_customers
description: Show how query_customers would read the database.
---
kind: tool
name: recommend_indexes
type: mysql-recommend-indexes
tool: query_customers
description: Suggest indexes for query_customers, for review by a DBA.
